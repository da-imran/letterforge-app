name: letterforge-ci

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

jobs:
  build:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (server)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: letterforge-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Done
        run: echo "CI pipeline build stage completed."

  test:
    name: Backend tests
    needs: build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm install

      - name: Create server .env
        run: |
          cat > packages/server/.env <<EOF
          NODE_ENV=ci
          HOSTNAME=localhost
          ROUTE_PREPEND=letter-forge
          API_VERSION=1.0.0
          APP_VERSION=1.0.0
          VERSION=v1
          PORT=8888
          SERVICE_NAME=letter-forge
          MONGO_URI=mongodb://localhost:27017/
          MONGODB_DBNAME=letter-forge-test
          EOF

      - name: Run backend tests
        working-directory: packages/server
        run: npm test
        env:
          CI: true

      - name: Done
        run: echo "CI pipeline test stage completed."

  frontend:
    name: Frontend typecheck, build & test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm install

      - name: Typecheck
        working-directory: packages/dashboard
        run: npm run typecheck

      - name: Test
        working-directory: packages/dashboard
        run: npm test

      - name: Build
        working-directory: packages/dashboard
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Done
        run: echo "CI pipeline frontend stage completed."
