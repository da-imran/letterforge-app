services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letter-forge-backend
    environment:
      NODE_ENV: production
      ROUTE_PREPEND: letter-forge
      SERVICE_NAME: letter-forge
      HOSTNAME: apidev
      API_VERSION: ${API_VERSION}
      APP_VERSION: ${APP_VERSION}
      VERSION: ${VERSION}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-data}
      MONGO_URI: mongodb://mongodb:27017/${MONGODB_DBNAME:-data}
      PORT: 8888
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: amqp://rabbitmq:5672
    ports:
      - "8888:8888"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - letter-forge-network
    restart: unless-stopped
    command: ["npm", "start"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letter-forge-worker
    environment:
      NODE_ENV: production
      MONGODB_DBNAME: ${MONGODB_DBNAME:-data}
      MONGO_URI: mongodb://mongodb:27017/${MONGODB_DBNAME:-data}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - letter-forge-network
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: letter-forge-rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - letter-forge-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: letter-forge-mongodb
    restart: unless-stopped
    volumes:
      - db_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - letter-forge-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  letter-forge-network:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data: