# Stop using the deprecated management_metrics_collection feature. RabbitMQ
# 3.13 emits a warning on every boot whenever it is used, and the
# deprecated_features.permit.* knob does not suppress it. This disables the
# legacy internal metrics collector (the management UI loses its charts) while
# the broker itself, its queues, and the Prometheus plugin keep working.
management_agent.disable_metrics_collector = true
