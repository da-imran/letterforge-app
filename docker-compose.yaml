services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letter-forge-server
    environment:
      NODE_ENV: dev
      ROUTE_PREPEND: letter-forge
      SERVICE_NAME: letter-forge
      HOSTNAME: apidev
      API_VERSION: ${API_VERSION:-1.0.0}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      VERSION: ${VERSION:-v1}
      MONGODB_DBNAME: ${MONGODB_DBNAME:-data}
      MONGO_URI: mongodb://mongodb:27017/${MONGODB_DBNAME:-data}
      PORT: 8888
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: amqp://rabbitmq:5672
    ports:
      - "8888:8888"
    networks:
      - letter-forge-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    command: ["node", "packages/server/app.js"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letter-forge-worker
    environment:
      NODE_ENV: dev
      MONGODB_DBNAME: ${MONGODB_DBNAME:-data}
      MONGO_URI: mongodb://mongodb:27017/${MONGODB_DBNAME:-data}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: amqp://rabbitmq:5672
    networks:
      - letter-forge-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    command: ["node", "packages/server/worker.js"]

  sync-achievements:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letter-forge-sync-achievements
    environment:
      NODE_ENV: dev
      MONGODB_DBNAME: ${MONGODB_DBNAME:-data}
      MONGO_URI: mongodb://mongodb:27017/${MONGODB_DBNAME:-data}
    networks:
      - letter-forge-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    command: ["node", "packages/server/jobs/syncAchievements.js"]

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: letter-forge-dashboard
    environment:
      NODE_ENV: production
    ports:
      - "9002:9002"
    networks:
      - letter-forge-network
    depends_on:
      - server
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: letter-forge-rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - letter-forge-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: letter-forge-mongodb
    restart: unless-stopped
    volumes:
      - db_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - letter-forge-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  letter-forge-network:
    driver: bridge

volumes:
  db_data:
    name: server_db_data
  rabbitmq_data:
